name: CI Validation

# ---------------------------------------------------------------------------
# DO NOT ADD AN AUTOMATIC TRIGGER TO THIS FILE.
#
# By explicit user policy (2026-09-28): as long as the vivera pipeline is
# the execution path for this repository, this workflow must not run on push or
# on pull request. GitHub Actions minutes on the free tier are the scarce
# resource here, and an automatic `push` trigger spends them on every commit
# whether or not anyone is waiting for the result.
#
# The checks below are not a safety net that is being removed; they run locally
# instead, and locally they are strictly stronger because they can see the real
# vault, the real Snipset database, and the real working tree:
#
#     bun run ci        # render-diagrams + validate-skill + agents + tests + snippets
#
# `workflow_dispatch` is retained deliberately. It costs nothing until someone
# presses Run, which makes this file documentation of what CI would do plus a
# deliberate, visible escape hatch for checking a clean checkout on a machine
# that is not this one.
#
# To revert to automatic runs: restore `push` and `pull_request` under `on:`,
# i.e.
#
#     on:
#       push:
#         branches: [ main ]
#       pull_request:
#         branches: [ main ]
#       workflow_dispatch:
#
# Nothing else in this file has to change. To delete the workflow outright:
# `git rm .github/workflows/ci.yml`.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # mermaid-cli 12 requires Node >= 22.13 and puppeteer ^25.
      # Pinned to the active LTS (Krypton), matching the local toolchain.
      # v7 enables automatic package-manager caching when package.json carries
      # a packageManager field. This repo installs with Bun, not npm, so the
      # npm cache would be pure overhead: disable it explicitly.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      # The skill mandates Bun as the only sanctioned runtime, and CI is the
      # loudest place that rule can be demonstrated rather than just asserted.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Puppeteer Browser
        run: bunx puppeteer browsers install chrome-headless-shell

      - name: Make scripts executable
        run: chmod +x install.sh scripts/sync.sh scripts/render-diagrams.sh

      - name: Render Mermaid Diagrams
        run: bash scripts/render-diagrams.sh

      - name: Fail if committed diagrams drifted from their Mermaid source
        run: |
          if ! git diff --quiet -- diagrams/; then
            echo "::error::Committed diagrams are out of sync with their Mermaid source."
            echo "Run 'bash scripts/render-diagrams.sh' and commit the result."
            git diff --stat -- diagrams/
            exit 1
          fi

      - name: Upload Diagram Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mermaid-diagrams
          path: diagrams/
        if-no-files-found: warn

      # The mirror-drift gate, the plan-lifecycle audit, and the skip_if registry
      # audit are absent from this file on purpose: all three walk the
      # developer's own Obsidian vault via plans.publish.json (the first two
      # also need the real Snipset database), which a hosted runner does not
      # have. On a runner with no vault the registry enumerates nothing, and the
      # skipif audit exits 1 with "nothing measured", which would be a red build
      # reporting the absence of data as a defect. `bun run ci` covers what is
      # portable, and the local commands below are the ones that close the loop.
      # Hosted runners lack the machine-only tgrep CLI that validate-skill.mjs requires; skip cleanly.
      - name: Run Skill Validation Script
        run: |
          command -v tgrep >/dev/null 2>&1 || { echo "tgrep not available on this runner; skipping (local-only prerequisite)"; exit 0; }
          bun scripts/validate-skill.mjs

      - name: Validate Claude Code agents
        run: bun scripts/validate-agents.mjs

      - name: Check the sprite agents match their role templates
        run: bun scripts/gen-sprite-agents.mjs --check

      - name: Run Unit Tests
        run: bun test scripts/

      # Hosted runners lack the private snipset CLI; skip cleanly instead of probing an unreachable database.
      - name: Check trigger prompts against the Snipset database
        run: |
          command -v snipset >/dev/null 2>&1 || { echo "snipset not available on this runner; skipping (local-only integration)"; exit 0; }
          bun run snippets:check

      - name: Test Installer Dry-Run
        run: |
          ./install.sh --dry-run
