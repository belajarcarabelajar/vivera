name: Docs deploy

# ---------------------------------------------------------------------------
# The one workflow with an automatic trigger (owner decision 2026-11-15, plan
# 2026-11-15-docs-autodeploy). Every other workflow stays dispatch-only under
# the 2026-09-28 policy in ci.yml. vivera is a public repository, and standard
# GitHub-hosted runners in public repositories use no paid minutes (GitHub
# Actions billing docs, read 2026-11-15).
#
# What it does: a push to main that changes a docs input (the paths below,
# the same list as DOCS_INPUTS in scripts/docs-drift.mjs, checked by
# scripts/workflows.test.mjs) builds the docs site on the runner and deploys it
# to the Worker vivera-docs with scripts/docs-remote.sh deploy --local: the same
# build, dry run, deploy, live check and rollback as the VPS mode. The last step
# fails unless the live /docs/version.json names the pushed commit.
#
# Credentials: environment docs-production (deployments from main only) holds
# the secret VIVERA_DOCS_CF_TOKEN and the variable CLOUDFLARE_ACCOUNT_ID. The
# token can edit every Worker on the account (Cloudflare does not scope Workers
# Scripts Edit to one Worker); docs-remote.sh unexports it and hands it to the
# wrangler commands only, so bun install, cargo build scripts and pagefind never
# see it.
#
# Kill switch: gh workflow disable docs-deploy.yml (gh workflow enable to undo).
# Revert: git rm .github/workflows/docs-deploy.yml, then delete the
# docs-production environment and revoke the token in the Cloudflare dashboard.
# Check by hand at any time: git fetch origin && bun run docs:drift
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs-deploy.yml'
      - 'README.md'
      - 'apps/docs/**'
      - 'bun.lock'
      - 'diagrams/**'
      - 'docs/graphify-integration.md'
      - 'docs/guide/**'
      - 'docs/vivera-glossary.md'
      - 'package.json'
      - 'scripts/docs-gen.mjs'
      - 'scripts/docs-remote.sh'
      - 'scripts/docs-site-check.mjs'
      - 'scripts/lib/docs-gen-*.mjs'
      - 'scripts/lib/docs-include.mjs'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and a running deploy is never cancelled halfway.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: docs-production
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      # The runner image ships rustup with a stable toolchain; apps/docs needs edition 2024.
      - name: Show the Rust toolchain
        run: rustc --version && cargo --version

      - name: Cache the docs crate build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/docs -> target

      - name: Build and deploy the docs site
        env:
          VIVERA_DOCS_DEPLOY_ACK: I_UNDERSTAND_THIS_CHANGES_LIVE
          VIVERA_DOCS_CF_TOKEN: ${{ secrets.VIVERA_DOCS_CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VIVERA_DOCS_TARGET_DIR: ${{ github.workspace }}/apps/docs/target
          VIVERA_DOCS_LOG_DIR: ${{ runner.temp }}
        run: scripts/docs-remote.sh deploy --local

      - name: Check the live site serves this commit
        run: bun scripts/docs-drift.mjs --expect ${{ github.sha }}
