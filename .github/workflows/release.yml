name: Release

# ---------------------------------------------------------------------------
# DO NOT ADD AN AUTOMATIC TRIGGER TO THIS FILE.
#
# This workflow has NO automatic trigger: not on push, not on a tag, not on a
# schedule. It runs only when someone presses Run workflow, and the same user
# policy as ci.yml applies (2026-09-28): GitHub Actions minutes are scarce and a
# release is a human decision, not a side effect of a commit.
#
# `dry_run` defaults to true. A dry run builds the archive and uploads it as a
# workflow artifact, and publishes nothing. The first real publish is a human
# decision: dispatch with `dry_run` false only after explicit confirmation, and
# only after reading the dry-run artifact.
#
# The only permission is `contents: write`, and it is set on the job, not on
# the workflow, because creating a release is the one thing that needs it.
#
# To revert: `git rm .github/workflows/release.yml`. A release that was already
# published is not touched by that; delete it with `gh release delete <tag>`.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.2.3 or v1.2.3-rc.1'
        type: string
        required: true
      dry_run:
        description: 'Build and upload the archive only; publish nothing'
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The tag reaches the script through env, never through ${{ }} inside the
      # script text, so a hostile tag value cannot become shell syntax.
      - name: Build the archive
        env:
          TAG: ${{ inputs.tag }}
        run: scripts/release/build-archive.sh "$TAG" dist

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: vivera-release
          path: dist/
          if-no-files-found: error

      - name: Publish the release
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes --target "$GITHUB_SHA"
